<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>消防車両 製作管理</title>
  <meta name="description" content="消防車両の製作工程・進捗・写真記録を管理する業務アプリ">

  <!-- テーマ / PWA -->
  <meta name="theme-color" content="#f4f1ee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="製作管理">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- アイコン -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon_32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/android_192_xxxhdpi.png">
  <link rel="apple-touch-icon" href="icons/ios_180_iphone-3x.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/ios_152_ipad-2x.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/ios_167_ipad_pro.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/ios_180_iphone-3x.png">

  <!-- フォント（Barlow Condensed / Barlow / Noto Sans JP） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="app.css">

  <!-- スタート画面（スプラッシュ）: app.css の遅延に依存せず即座に正しく描画するためインライン -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #f4f1ee;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      opacity: 1; transition: opacity .5s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-inner {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      animation: splash-pop .6s ease both;
    }
    .splash-logo { width: min(76vw, 324px); height: auto; display: block; user-select: none; -webkit-user-drag: none; }
    @keyframes splash-pop {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-inner { animation: none; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <!-- スタート画面（スプラッシュ）: 起動直後に表示し、約2秒でフェードして案件一覧へ -->
  <div id="splash" role="status" aria-label="起動中">
    <div class="splash-inner">
      <img class="splash-logo" src="icons/icon_master_1024.png" width="1024" height="1024"
           alt="FIRE ENGINE" fetchpriority="high" decoding="async">
    </div>
  </div>
  <script>
    // スプラッシュ制御: 起動から約2秒でフェードアウトし、DOMから除去して案件一覧を表示する。
    // （ボタン操作は不要。prefers-reduced-motion 時は CSS 側でトランジション無効）
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var HOLD = 2000;   // 表示保持時間（約2秒）
      var FADE = 500;    // フェード時間（CSS の transition と一致）
      function dismiss() {
        splash.classList.add('hide');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, FADE + 60);
      }
      setTimeout(dismiss, HOLD);
    })();
  </script>

  <script>
    // ページ全体のピンチ／ダブルタップ拡大を無効化する。
    // ボタンや入力のタップで画面が勝手に拡大するのを防ぐ（touch-action と併用）。
    // 写真拡大ビューア(.lightbox)内だけは指でのズーム操作を許可する（除外）。
    (function () {
      function inLightbox(t) { return !!(t && t.closest && t.closest('.lightbox')); }
      // iOS Safari のピンチジェスチャを抑止
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
        document.addEventListener(ev, function (e) {
          if (!inLightbox(e.target)) e.preventDefault();
        }, { passive: false });
      });
      // 2本指のタッチ移動（ピンチ）を抑止（touch-action非対応環境の保険）
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1 && !inLightbox(e.target)) e.preventDefault();
      }, { passive: false });
    })();
  </script>

  <div id="root">
    <div class="loading"><div class="spinner"></div><div>起動中…</div></div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Service Worker 登録（PWA・オフラインシェル）＋ 自動更新
    // 新しい版を検知したら skipWaiting 済みの新SWが即座に有効化 → controllerchange で
    // 現在のページを1回だけ自動リロードし、確実に最新へ切り替える。
    if ('serviceWorker' in navigator) {
      var swReloaded = false;
      var hadController = !!navigator.serviceWorker.controller;

      function showUpdatePill(text) {
        var el = document.createElement('div');
        el.textContent = text;
        el.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));'
          + 'transform:translateX(-50%);z-index:200;background:#1d1f20;color:#fff;'
          + 'padding:10px 16px;font:600 13px/1.4 system-ui,sans-serif;'
          + 'box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;';
        document.body.appendChild(el);
      }

      // 新しいSWが制御を握った瞬間に一度だけ再読み込み（初回インストール時は不要）
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (swReloaded || !hadController) return;
        swReloaded = true;
        showUpdatePill('新しい版に更新しています…');
        setTimeout(function () { window.location.reload(); }, 800);
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 起動時に更新チェック
          reg.update().catch(function () {});
          // 画面に戻ったときも更新チェック（ホーム画面PWAの長時間起動対策）
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function (e) { console.warn('SW登録失敗', e); });
      });
    }
  </script>
</body>
</html>
