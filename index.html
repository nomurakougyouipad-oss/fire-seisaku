<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>消防車両 製作管理</title>
  <meta name="description" content="消防車両の製作工程・進捗・写真記録を管理する業務アプリ">

  <!-- テーマ / PWA -->
  <meta name="theme-color" content="#f4f1ee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="製作管理">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- アイコン -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon_32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/android_192_xxxhdpi.png">
  <link rel="apple-touch-icon" href="icons/ios_180_iphone-3x.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/ios_152_ipad-2x.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/ios_167_ipad_pro.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/ios_180_iphone-3x.png">

  <!-- フォント（Barlow Condensed / Barlow / Noto Sans JP） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- スタート画面（スプラッシュ）: app.css の遅延に依存せず1フレーム目から正しく描画するためインライン。
       起動直後の白チラつき対策として html/body の背景も先に白へ固定する
       （app.css がこの後に読み込まれ、アプリ本来の背景色で上書きされる）。
       ロゴは PNG（ベージュ背景入り）ではなくインラインSVGで再現し、白背景に馴染ませる。 -->
  <style>
    html, body { margin: 0; background: #fff; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      opacity: 1;
      transition: opacity .45s ease-in; /* 消滅フェード */
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: min(28vw, 280px); height: auto; display: block;
      user-select: none; -webkit-user-drag: none;
      transform-origin: center center;
      will-change: transform, opacity;
      transition: transform .45s ease-in; /* ズーム */
    }
    /* ズーム消滅: ロゴが手前に拡大(1→8倍)しながら全体フェードアウト */
    #splash.hide .splash-logo { transform: scale(8); }
    @media (prefers-reduced-motion: reduce) {
      #splash, .splash-logo { transition: opacity .3s ease; }
      #splash.hide .splash-logo { transform: none; }
    }
  </style>

  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- スタート画面（スプラッシュ）: アプリアイコン（FEロゴ）をインラインSVGで再現。
       初回データ読み込み完了で app.js が window.hideSplash() を呼んでフェードアウトする。
       ※ アイコンPNGはベージュ背景入りのため白背景には使わず、SVGで描画する -->
  <div id="splash" role="status" aria-label="起動中">
    <svg class="splash-logo" viewBox="222 287 580 580" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#C8392E">
        <!-- F -->
        <rect x="286" y="308" width="80" height="330"/>
        <rect x="286" y="308" width="214" height="64"/>
        <rect x="286" y="440" width="180" height="62"/>
        <!-- E -->
        <rect x="542" y="308" width="80" height="330"/>
        <rect x="542" y="308" width="202" height="64"/>
        <rect x="542" y="438" width="188" height="64"/>
        <rect x="542" y="574" width="202" height="64"/>
        <!-- 下線バー -->
        <rect x="298" y="696" width="430" height="36" rx="18"/>
      </g>
      <text x="507" y="845" text-anchor="middle" fill="#A52A21"
        font-size="70" font-weight="600" letter-spacing="10"
        font-family="'Barlow','Poppins',system-ui,-apple-system,sans-serif">FIRE ENGINE</text>
    </svg>
  </div>
  <script>
    // スプラッシュ制御:
    // ・読み込みが早くても最低0.8秒は表示（一瞬で消えるチラつき防止）。
    // ・app.js が初回データ到着時に window.hideSplash() を呼ぶ。
    //   万一呼ばれなくても8秒で必ず消える（起動画面のまま固まらない保険）。
    (function () {
      var el = document.getElementById('splash');
      if (!el) return;
      var shownAt = Date.now();
      var MIN_MS = 800;   // 最低表示時間
      var hiding = false;
      window.hideSplash = function () {
        if (hiding) return;
        hiding = true;
        var rest = Math.max(0, MIN_MS - (Date.now() - shownAt));
        setTimeout(function () {
          el.classList.add('hide');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 500); // フェード(0.45s)完了後にDOMから除去
        }, rest);
      };
      setTimeout(window.hideSplash, 8000); // 保険
    })();
  </script>

  <script>
    // ページ全体のピンチ／ダブルタップ拡大を無効化する。
    // ボタンや入力のタップで画面が勝手に拡大するのを防ぐ（touch-action と併用）。
    // 写真拡大ビューア(.lightbox)内だけは指でのズーム操作を許可する（除外）。
    (function () {
      function inLightbox(t) { return !!(t && t.closest && t.closest('.lightbox')); }
      // iOS Safari のピンチジェスチャを抑止
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
        document.addEventListener(ev, function (e) {
          if (!inLightbox(e.target)) e.preventDefault();
        }, { passive: false });
      });
      // 2本指のタッチ移動（ピンチ）を抑止（touch-action非対応環境の保険）
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1 && !inLightbox(e.target)) e.preventDefault();
      }, { passive: false });
    })();
  </script>

  <div id="root">
    <div class="loading"><div class="spinner"></div><div>起動中…</div></div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    // Service Worker 登録（PWA・オフラインシェル）＋ 自動更新
    // 新しい版を検知したら skipWaiting 済みの新SWが即座に有効化 → controllerchange で
    // 現在のページを1回だけ自動リロードし、確実に最新へ切り替える。
    if ('serviceWorker' in navigator) {
      var swReloaded = false;
      var hadController = !!navigator.serviceWorker.controller;

      function showUpdatePill(text) {
        var el = document.createElement('div');
        el.textContent = text;
        el.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));'
          + 'transform:translateX(-50%);z-index:200;background:#1d1f20;color:#fff;'
          + 'padding:10px 16px;font:600 13px/1.4 system-ui,sans-serif;'
          + 'box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;';
        document.body.appendChild(el);
      }

      // 新しいSWが制御を握った瞬間に一度だけ再読み込み（初回インストール時は不要）
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (swReloaded || !hadController) return;
        swReloaded = true;
        showUpdatePill('新しい版に更新しています…');
        setTimeout(function () { window.location.reload(); }, 800);
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 起動時に更新チェック
          reg.update().catch(function () {});
          // 画面に戻ったときも更新チェック（ホーム画面PWAの長時間起動対策）
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function (e) { console.warn('SW登録失敗', e); });
      });
    }
  </script>
</body>
</html>
